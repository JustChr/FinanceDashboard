name: Refresh bank offers

on:
  schedule:
    # 05:40 UTC daily. Off the hour deliberately: GitHub's scheduler is heavily
    # oversubscribed on the hour and delays those runs the most.
    - cron: '40 5 * * *'
  workflow_dispatch:

# The job commits the regenerated board back to the repository, then starts a
# Pages deploy so the live site serves it.
permissions:
  contents: write
  actions: write

concurrency:
  group: offers
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Scrape published bank condition pages
        run: node scripts/scrape/index.mjs

      - name: Commit the refreshed board
        # Committed on every run, not only when a rate moves. The dashboard greys
        # out an offer once `observedAt` ages past two weeks, so "we checked today
        # and nothing changed" is itself the information that keeps the board
        # showing as current — skipping the commit would make live rates look stale.
        #
        # The housing history is committed alongside it. Git is not the history
        # store — the file is — but every run's commit is a free audit trail of
        # when each episode was extended or opened.
        run: |
          # New history files are untracked on their first run, so check status, not diff.
          if [ -z "$(git status --porcelain -- public/data)" ]; then
            echo "Nothing to commit; the scrape produced identical files."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/offers.json public/data/*-history.json
          git commit -m "Refresh bank offer board"
          # Another push may have landed since checkout; rebase rather than
          # force, so a human commit is never overwritten by the scheduler.
          git pull --rebase --autostash
          git push

      - name: Deploy the refreshed board
        # A push made with GITHUB_TOKEN never starts another workflow, so the
        # commit above does not trigger deploy.yml, and the live site would keep
        # whatever data the last merge shipped. workflow_dispatch is exempt from
        # that rule, so ask for the deploy explicitly.
        run: gh workflow run deploy.yml --ref "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
